<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖店数据追踪表</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; margin-bottom: 6px; }
        .header p { color: #666; font-size: 12px; }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 12px;
            border-left: 3px solid #e83e8c;
            padding-left: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stat-item {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-item .label { font-size: 12px; color: #888; margin-bottom: 4px; }
        .stat-item .value { font-size: 22px; font-weight: bold; color: #e83e8c; }
        .stat-item .change { font-size: 11px; margin-top: 4px; }
        .change.up { color: #e74c3c; }
        .change.down { color: #27ae60; }
        .change.flat { color: #999; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #eee; font-size: 12px; }
        th { background: #fafafa; color: #666; font-weight: 600; }
        .chart-container { position: relative; height: 250px; margin-top: 12px; }
        .sync-info {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            background: #e83e8c;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>抖店数据追踪表</h1>
    <p>数据自动从云端同步</p>
</div>

<div class="sync-info" id="syncInfo">加载中...</div>

<div class="card">
    <h2>今日概览</h2>
    <div class="stats-grid">
        <div class="stat-item">
            <div class="label">访客</div>
            <div class="value" id="visitors">-</div>
            <div class="change" id="visitorsChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">曝光</div>
            <div class="value" id="exposure">-</div>
            <div class="change" id="exposureChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">订单</div>
            <div class="value" id="orders">-</div>
            <div class="change" id="ordersChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">成交额</div>
            <div class="value" id="revenue">-</div>
            <div class="change" id="revenueChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">转化率</div>
            <div class="value" id="conversion">-</div>
            <div class="change" id="conversionChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">体验分</div>
            <div class="value" id="score">-</div>
            <div class="change" id="scoreChange"></div>
        </div>
    </div>
</div>

<div class="card" id="productCard" style="display:none;">
    <h2>商品明细</h2>
    <table>
        <thead><tr><th>商品</th><th>曝光</th><th>订单</th><th>金额</th></tr></thead>
        <tbody id="productBody"></tbody>
    </table>
</div>

<div class="card">
    <h2>7天趋势</h2>
    <div class="chart-container">
        <canvas id="trendChart"></canvas>
    </div>
</div>

<div class="card">
    <h2>历史记录</h2>
    <table>
        <thead><tr><th>日期</th><th>访客</th><th>订单</th><th>成交额</th><th>转化率</th></tr></thead>
        <tbody id="historyBody"></tbody>
    </table>
    <div class="loading" id="noData" style="display:none;">暂无数据</div>
</div>

<button class="btn" id="btnRefresh">刷新数据</button>

<script src="mobile.js"></script>
</body>
</html>
