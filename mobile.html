<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抖店数据追踪表</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; margin-bottom: 6px; }
        .header p { color: #666; font-size: 12px; }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06);
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 12px;
            border-left: 3px solid #e83e8c;
            padding-left: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .stat-item {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }
        .stat-item .label { font-size: 12px; color: #888; margin-bottom: 4px; }
        .stat-item .value { font-size: 22px; font-weight: bold; color: #e83e8c; }
        .stat-item .change { font-size: 11px; margin-top: 4px; }
        .change.up { color: #e74c3c; }
        .change.down { color: #27ae60; }
        .change.flat { color: #999; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #eee; font-size: 12px; }
        th { background: #fafafa; color: #666; font-weight: 600; }
        .chart-container { position: relative; height: 250px; margin-top: 12px; }
        .sync-info {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            background: #e83e8c;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
        }
        .debug {
            text-align: center;
            color: #999;
            font-size: 11px;
            margin-top: 8px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>抖店数据追踪表</h1>
    <p>数据自动从云端同步</p>
</div>

<div class="sync-info" id="syncInfo">加载中...</div>

<div class="card">
    <h2>今日概览</h2>
    <div class="stats-grid">
        <div class="stat-item">
            <div class="label">访客</div>
            <div class="value" id="visitors">-</div>
            <div class="change" id="visitorsChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">曝光</div>
            <div class="value" id="exposure">-</div>
            <div class="change" id="exposureChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">订单</div>
            <div class="value" id="orders">-</div>
            <div class="change" id="ordersChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">成交额</div>
            <div class="value" id="revenue">-</div>
            <div class="change" id="revenueChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">转化率</div>
            <div class="value" id="conversion">-</div>
            <div class="change" id="conversionChange"></div>
        </div>
        <div class="stat-item">
            <div class="label">体验分</div>
            <div class="value" id="score">-</div>
            <div class="change" id="scoreChange"></div>
        </div>
    </div>
</div>

<div class="card" id="productCard" style="display:none;">
    <h2>商品明细</h2>
    <table>
        <thead><tr><th>商品</th><th>曝光</th><th>订单</th><th>金额</th></tr></thead>
        <tbody id="productBody"></tbody>
    </table>
</div>

<div class="card">
    <h2>7天趋势</h2>
    <div class="chart-container">
        <canvas id="trendChart"></canvas>
    </div>
</div>

<div class="card">
    <h2>历史记录</h2>
    <table>
        <thead><tr><th>日期</th><th>访客</th><th>订单</th><th>成交额</th><th>转化率</th></tr></thead>
        <tbody id="historyBody"></tbody>
    </table>
    <div class="loading" id="noData" style="display:none;">暂无数据</div>
</div>

<button class="btn" id="btnRefresh">刷新数据</button>
<div class="debug" id="debugInfo"></div>

<script>
// 尝试多个数据源
var DATA_URLS = [
    'https://zzwz200607-sys.github.io/doudian-tracker/data.json',
    'https://raw.githubusercontent.com/zzwz200607-sys/doudian-tracker/main/data.json'
];

function dbg(msg) {
    var el = document.getElementById('debugInfo');
    if (el) el.textContent = msg;
    console.log(msg);
}

function calcConversion(visitors, orders) {
    if (!visitors || visitors === 0) return 0;
    return (orders / visitors * 100).toFixed(2);
}

function getChange(current, previous) {
    if (!previous || previous === 0) return { text: '-', cls: 'flat' };
    var diff = current - previous;
    var pct = (diff / previous * 100).toFixed(1);
    if (diff > 0) return { text: '\u2191 ' + pct + '%', cls: 'up' };
    if (diff < 0) return { text: '\u2193 ' + pct + '%', cls: 'down' };
    return { text: '\u2192', cls: 'flat' };
}

async function loadData() {
    document.getElementById('syncInfo').textContent = '正在加载...';
    dbg('开始加载数据');

    for (var i = 0; i < DATA_URLS.length; i++) {
        var url = DATA_URLS[i] + '?t=' + Date.now();
        dbg('尝试: ' + DATA_URLS[i]);
        try {
            var response = await fetch(url);
            dbg('响应状态: ' + response.status);
            if (!response.ok) {
                dbg('失败: HTTP ' + response.status);
                continue;
            }
            var data = await response.json();
            dbg('数据条数: ' + (Array.isArray(data) ? data.length : '非数组'));
            if (!Array.isArray(data) || data.length === 0) {
                document.getElementById('syncInfo').textContent = '暂无数据，请先在电脑端抓取并上传';
                document.getElementById('noData').style.display = 'block';
                return;
            }
            renderStats(data);
            renderHistory(data);
            renderChart(data);
            var today = data[data.length - 1];
            if (today.captureTime) {
                document.getElementById('syncInfo').textContent = '最后更新：' + new Date(today.captureTime).toLocaleString('zh-CN');
            } else {
                document.getElementById('syncInfo').textContent = '数据日期：' + today.date;
            }
            dbg('加载成功');
            return;
        } catch(err) {
            dbg('错误: ' + err.message);
        }
    }
    document.getElementById('syncInfo').textContent = '加载失败，请稍后重试';
    dbg('所有数据源都失败了');
}

function renderStats(data) {
    var today = data[data.length - 1];
    var yesterday = data.length >= 2 ? data[data.length - 2] : null;

    document.getElementById('visitors').textContent = today.visitors || '-';
    document.getElementById('exposure').textContent = today.exposure || '-';
    document.getElementById('orders').textContent = today.orders || '-';
    document.getElementById('revenue').textContent = '\u00a5' + (today.revenue || 0).toFixed(2);
    document.getElementById('conversion').textContent = (today.conversion || calcConversion(today.visitors, today.orders)) + '%';
    document.getElementById('score').textContent = today.score || '-';

    var ids = ['visitors','exposure','orders','revenue','score'];
    ids.forEach(function(id) {
        var ch = getChange(today[id], yesterday ? yesterday[id] : 0);
        document.getElementById(id + 'Change').textContent = ch.text;
        document.getElementById(id + 'Change').className = 'change ' + ch.cls;
    });

    var todayConv = parseFloat(today.conversion || calcConversion(today.visitors, today.orders));
    var yConv = yesterday ? parseFloat(yesterday.conversion || calcConversion(yesterday.visitors, yesterday.orders)) : 0;
    var cCh = getChange(todayConv, yConv);
    document.getElementById('conversionChange').textContent = cCh.text;
    document.getElementById('conversionChange').className = 'change ' + cCh.cls;

    if (today.productStats && today.productStats.length > 0) {
        document.getElementById('productCard').style.display = 'block';
        var tbody = document.getElementById('productBody');
        tbody.innerHTML = '';
        today.productStats.forEach(function(p) {
            var tr = document.createElement('tr');
            tr.innerHTML = '<td style="text-align:left;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + p.name + '</td><td>' + p.exposure + '</td><td>' + p.orders + '</td><td>\u00a5' + (p.revenue || 0).toFixed(2) + '</td>';
            tbody.appendChild(tr);
        });
    }
}

function renderHistory(data) {
    var tbody = document.getElementById('historyBody');
    var noData = document.getElementById('noData');
    tbody.innerHTML = '';
    if (data.length === 0) { noData.style.display = 'block'; return; }
    noData.style.display = 'none';
    var sorted = data.slice().reverse().slice(0, 14);
    sorted.forEach(function(row) {
        var conv = row.conversion || calcConversion(row.visitors, row.orders);
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + row.date + '</td><td>' + row.visitors + '</td><td>' + row.orders + '</td><td>\u00a5' + (row.revenue || 0).toFixed(2) + '</td><td>' + conv + '%</td>';
        tbody.appendChild(tr);
    });
}

var trendChart = null;
function renderChart(data) {
    var canvas = document.getElementById('trendChart');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    var last7 = data.slice(-7);
    if (trendChart) trendChart.destroy();
    if (last7.length === 0) return;
    trendChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: last7.map(function(r) { return r.date.slice(5); }),
            datasets: [
                { label: '访客', data: last7.map(function(r) { return r.visitors; }), borderColor: '#e83e8c', backgroundColor: 'rgba(232,62,140,0.1)', tension: 0.3, fill: true },
                { label: '曝光', data: last7.map(function(r) { return r.exposure; }), borderColor: '#6c5ce7', backgroundColor: 'rgba(108,92,231,0.1)', tension: 0.3, fill: true },
                { label: '订单', data: last7.map(function(r) { return r.orders; }), borderColor: '#00b894', backgroundColor: 'rgba(0,184,148,0.1)', tension: 0.3, fill: true }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
    });
}

window.onload = function() {
    loadData();
    var btn = document.getElementById('btnRefresh');
    if (btn) btn.addEventListener('click', loadData);
    setInterval(loadData, 60000);
};
</script>
</body>
</html>
